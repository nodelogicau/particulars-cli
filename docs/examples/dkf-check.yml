# Sample GitHub Action for repositories that hold a DKF workspace.
# Copy to .github/workflows/dkf-check.yml and adjust the `paths` filter and
# DKF_WORKSPACE to where your workspace lives.
name: DKF check
on:
  pull_request:
    paths: ["knowledge/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DKF_WORKSPACE: ${{ github.workspace }}/knowledge
      PARTICULARS_VERSION: v0.2.0
    steps:
      - uses: actions/checkout@v4

      - name: Install particulars
        run: |
          curl -sSL -o particulars.tgz \
            "https://github.com/nodelogicau/particulars-cli/releases/download/${PARTICULARS_VERSION}/particulars_${PARTICULARS_VERSION#v}_linux_amd64.tar.gz"
          # extract to a temp dir: a workspace at the repo root has a particulars/ directory
          tar -xzf particulars.tgz -C "${RUNNER_TEMP}" particulars
          sudo install "${RUNNER_TEMP}/particulars" /usr/local/bin/particulars
          particulars version

      - name: Validate workspace
        run: particulars validate

      - name: Index is current
        run: particulars index --check

      - name: Report open conflicts
        if: always()
        run: |
          {
            echo '### Knowledge awaiting synthesis'
            echo
            echo '```'
            particulars conflicts || true
            echo '```'
          } > conflicts.md
          cat conflicts.md >> "$GITHUB_STEP_SUMMARY"

      # Optional: draw the particulars this pull request touches, so a reviewer
      # sees the shape of what changed — which claim is the antithesis, whether
      # the new synthesis became the current belief — without cloning.
      #
      # A diagram discloses whatever it contains. Before enabling this, decide
      # whether every particular it might draw is safe to render in a comment,
      # and set --scope accordingly. See docs/visualise.md.
      #
      # - name: Draw what changed
      #   if: always() && github.event_name == 'pull_request'
      #   run: |
      #     git fetch --depth=1 origin "${{ github.base_ref }}"
      #     subjects=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
      #       -- 'claims/*.yaml' 'syntheses/*.yaml' \
      #       | xargs -r -I{} sh -c 'sed -n "s/^subject: //p" {}' | sort -u)
      #     [ -n "${subjects}" ] || exit 0
      #     {
      #       echo
      #       echo '### What changed'
      #       for s in ${subjects}; do
      #         echo
      #         echo '```mermaid'
      #         particulars export --format mermaid --subject "${s}" || true
      #         echo '```'
      #       done
      #     } >> conflicts.md

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('conflicts.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
