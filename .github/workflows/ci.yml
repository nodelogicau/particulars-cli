name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./... -count=1
      - name: Installed skill matches the binary
        if: runner.os != 'Windows'
        run: |
          go build -o /tmp/particulars ./cmd/particulars
          /tmp/particulars skill install --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  bundle:
    name: Desktop bundle (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # build-bundle.sh refuses to write a bundle whose macOS binary is not
      # universal, so a green job is the assertion.
      - run: make bundle
      - name: Bundle is universal and complete
        run: |
          mkdir -p /tmp/mcpb && unzip -q dist/particulars-*.mcpb -d /tmp/mcpb
          file /tmp/mcpb/server/darwin/particulars | grep -q "universal binary"
          test -x /tmp/mcpb/server/darwin/particulars && test -s /tmp/mcpb/server/win32/particulars.exe
          python3 -c "import json;json.load(open('/tmp/mcpb/manifest.json'))"

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make cross
