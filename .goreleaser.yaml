version: 2

project_name: particulars

before:
  hooks:
    - go mod tidy

builds:
  - id: particulars
    main: ./cmd/particulars
    binary: particulars
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nodelogicau/particulars-cli/internal/cli.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# Darwin universal binary for the Desktop bundle (MCPB platform overrides are
# keyed by OS, not arch). The per-arch archives are unaffected.
universal_binaries:
  - id: particulars-universal
    ids: [particulars]
    replace: false
    name_template: particulars
    hooks:
      post: sh scripts/build-bundle.sh {{ .Version }} dist

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: dist/*.mcpb

# Homebrew cask (macOS). `brews` was removed in GoReleaser 2.16; casks are the
# supported way to ship a pre-built binary. Linux users have install.sh.
homebrew_casks:
  - name: particulars
    repository:
      owner: nodelogicau
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/nodelogicau/particulars-cli
    description: Capture and recall dialectical knowledge (DKF) from the command line
    license: MIT
    skip_upload: auto
    commit_author:
      name: particulars-release
      email: noreply@nodelogic.au
    url:
      verified: github.com/nodelogicau/particulars-cli/
    binaries:
      - particulars
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/particulars"]
          end

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  draft: false
  prerelease: auto
  extra_files:
    - glob: dist/*.mcpb
